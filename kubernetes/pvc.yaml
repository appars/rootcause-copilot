# Persistent storage for SQLite incident memory.
# No storageClassName: the cluster default is used (Rancher Desktop / k3s ships "local-path").
# local-path binds with WaitForFirstConsumer: the PVC shows Pending until the pod is scheduled - that is normal.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rootcause-data
  namespace: rootcause
  annotations:
    # Safety for GitOps: ArgoCD never prunes this volume, and keeps it even if the ArgoCD Application
    # is deleted (Delete=false). Incident memory is only removed by an explicit "kubectl delete pvc".
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
