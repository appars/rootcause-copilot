# Kustomize entry point - used by BOTH deployment paths:
#   manual:  kubectl apply -k kubernetes/
#   GitOps:  ArgoCD (argocd/rootcause-copilot-application.yaml, path: kubernetes)
# Preview the exact YAML that will be applied:  kubectl kustomize kubernetes/
# The image is set in ONE place: deployment.yaml (replace DOCKERHUB_USERNAME there).
# The Groq Secret is NOT listed here on purpose - it is created by hand and never committed (see README.md).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
