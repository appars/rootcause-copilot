# Kustomize lets us change the image tag in ONE place for each release (day4-v1 -> day5-v2).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
images:
  - name: docker.io/DOCKERHUB_USERNAME/rootcause-copilot
    newName: docker.io/DOCKERHUB_USERNAME/rootcause-copilot   # PLACEHOLDER: replace DOCKERHUB_USERNAME (lowercase)
    newTag: day4-v1
