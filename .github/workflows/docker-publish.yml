# OPTIONAL - publish the image to Docker Hub from GitHub (manual button only, never automatic).
# The workshop's main path is publishing from your own laptop (README_WINDOWS.md / README_MAC.md, "Docker Hub").
#
# To use it: GitHub repository -> Settings -> Secrets and variables -> Actions -> New repository secret
#   DOCKERHUB_USERNAME  = your Docker Hub username
#   DOCKERHUB_TOKEN     = a Docker Hub personal access token (Read & Write) - NEVER your password
# Then: Actions -> "docker-publish" -> Run workflow.
# Without both secrets the job stops with an explanation and pushes nothing.
name: docker-publish

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      HAS_TOKEN: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - name: Check that the Docker Hub secrets exist
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::Add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN as repository secrets first. Nothing was pushed."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3      # lets one runner build arm64 (Apple Silicon) as well as amd64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push DOCKERHUB_USERNAME/rootcause-copilot:latest (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/rootcause-copilot:latest
