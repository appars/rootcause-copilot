# SYNTHETIC training manifest for scenario INC-004 (notification-service). Not a real system.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: shop
  labels: {app: notification-service}
spec:
  replicas: 2
  selector:
    matchLabels: {app: notification-service}
  template:
    metadata:
      labels: {app: notification-service, version: "2.3.0"}
    spec:
      containers:
        - name: notification-service
          image: registry.example.local/notification-service:2.3.0
          ports:
            - {name: http, containerPort: 8080}
          envFrom:
            - configMapRef:
                name: notification-config-v2
          env:
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef: {name: notification-smtp, key: password}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            initialDelaySeconds: 20
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-config
  namespace: shop
data:
  SMTP_HOST: smtp.mail.example.local
  SMTP_PORT: "587"
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: shop
spec:
  selector: {app: notification-service}
  ports:
    - {port: 80, targetPort: 8080}
