# SYNTHETIC training manifest for scenario INC-003 (inventory-service). Not a real system.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: shop
  labels: {app: inventory-service}
spec:
  replicas: 2
  selector:
    matchLabels: {app: inventory-service}
  template:
    metadata:
      labels: {app: inventory-service}
    spec:
      containers:
        - name: inventory-service
          image: registry.example.local/inventory-service:4.8.1
          ports:
            - {name: http, containerPort: 8080}
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx480m"
            - name: PRODUCT_CACHE_MAX_ENTRIES
              valueFrom:
                configMapKeyRef: {name: inventory-config, key: productCacheMaxEntries}
          resources:
            requests: {cpu: 250m, memory: 384Mi}
            limits: {cpu: "1", memory: 512Mi}
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: inventory-config
  namespace: shop
data:
  productCacheMaxEntries: "0"   # 0 = unbounded in this fictional application
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: shop
spec:
  selector: {app: inventory-service}
  ports:
    - {port: 80, targetPort: http}
